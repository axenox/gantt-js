name: Build dist

on:
    workflow_dispatch:
    #push: #Uncomment it to enable automatic dist build on push to main branch
        paths:
            - 'src/**'
            - 'package.json'
            - 'vite.config.js'
            - '.github/workflows/build-dist.yml'

permissions:
    contents: write

concurrency:
    group: build-dist-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-dist:
        name: Build and commit dist
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Build frappe-gantt dist
              run: npm run build

            - name: Commit updated dist files
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A dist

                  if git diff --cached --quiet; then
                      echo "No dist changes to commit."
                      exit 0
                  fi

                  git commit -m "Build dist"
                  git push