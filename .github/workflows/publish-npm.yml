name: Publish npm package

on:
    workflow_dispatch:
        inputs:
            publish:
                description: 'Publish package to npm after building and packing'
                required: true
                default: false
                type: boolean
            version_bump:
                description: 'Version increment used before publishing'
                required: true
                default: 'patch'
                type: choice
                options:
                    - patch
                    - minor
                    - major
            npm_tag:
                description: 'npm dist-tag used when publish is enabled'
                required: true
                default: 'latest'
                type: choice
                options:
                    - latest
                    - next
                    - beta

permissions:
    contents: write
    id-token: write

jobs:
    package:
        name: Build, pack and optionally publish
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: 'https://registry.npmjs.org'

            - name: Setup npm CLI with trusted publishing support
              run: npm install -g npm@11

            - name: Bump package version
              if: ${{ inputs.publish }}
              run: npm version "${{ inputs.version_bump }}" --no-git-tag-version

            - name: Install dependencies
              run: npm install

            - name: Build package files
              run: npm run build

            - name: Show package contents
              run: npm pack --dry-run

            - name: Create npm package artifact
              run: npm pack --json > npm-pack-result.json

            - name: Upload npm package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: npm-package
                  path: |
                      *.tgz
                      npm-pack-result.json

            - name: Create version commit and tag
              if: ${{ inputs.publish }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json
                  git commit -m "Bump package version to v$VERSION"
                  git tag -a "v$VERSION" -m "v$VERSION"

            - name: Publish package to npm
              if: ${{ inputs.publish }}
              run: |
                  PACKAGE_NAME=$(node -p "require('./package.json').name")

                  if [[ "$PACKAGE_NAME" == @* ]]; then
                      npm publish --access public --tag "${{ inputs.npm_tag }}"
                  else
                      npm publish --tag "${{ inputs.npm_tag }}"
                  fi

            - name: Push version commit and tag
              if: ${{ inputs.publish }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  git push origin HEAD:${{ github.ref_name }} "v$VERSION"

            - name: Create GitHub release
              if: ${{ inputs.publish }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG_NAME="v$VERSION"
                  RELEASE_TITLE="riel-gantt $TAG_NAME"
                  RELEASE_NOTES="Published riel-gantt@$VERSION to npm with dist-tag '${{ inputs.npm_tag }}'."

                  if [[ "${{ inputs.npm_tag }}" == "latest" ]]; then
                      gh release create "$TAG_NAME" *.tgz \
                          --title "$RELEASE_TITLE" \
                          --notes "$RELEASE_NOTES"
                  else
                      gh release create "$TAG_NAME" *.tgz \
                          --title "$RELEASE_TITLE" \
                          --notes "$RELEASE_NOTES" \
                          --prerelease
                  fi
